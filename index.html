    <script>
        // Safe localStorage helpers (prevents crashes in sandboxed web environments)
        function getSafeStorage(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                console.warn('LocalStorage read failed:', e);
                return null;
            }
        }

        function setSafeStorage(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                console.warn('LocalStorage save failed:', e);
            }
        }

        function removeSafeStorage(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {
                console.warn('LocalStorage remove failed:', e);
            }
        }

        // Web Audio API Sound Synthesizer
        let soundEnabled = true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'warning') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(120, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch (e) {
                console.log('Audio Context error', e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const text = document.getElementById('sound-text');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-amber-500';
                text.innerText = '音效: 开';
                playSound('click');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
                text.innerText = '音效: 关';
            }
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            playSound('click');
        }

        let secretClickCount = 0;
        let secretClickTimer = null;
        function handleSecretClick() {
            secretClickCount++;
            clearTimeout(secretClickTimer);
            secretClickTimer = setTimeout(() => {
                secretClickCount = 0;
            }, 2000);
            
            // 隐蔽入口：2秒内连续点击左上角 LEO 头像 5 次可再次打开照片设置
            if (secretClickCount >= 5) {
                secretClickCount = 0;
                toggleAdvisorSettings();
            }
        }

        function toggleAdvisorSettings() {
            const modal = document.getElementById('advisor-settings-modal');
            if (modal) {
                modal.classList.toggle('hidden');
                playSound('click');
            }
        }

        function handleModalFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('modal-photo-url').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveAdvisorPhoto() {
            const urlInput = document.getElementById('modal-photo-url').value.trim();
            if (urlInput) {
                gameState.avatarUrl = urlInput;
                setSafeStorage('leo_advisor_avatar', urlInput);
            }
            toggleAdvisorSettings();
            render();
            playSound('success');
        }

        function clearAdvisorPhoto() {
            gameState.avatarUrl = null;
            removeSafeStorage('leo_advisor_avatar');
            document.getElementById('modal-photo-url').value = '';
            toggleAdvisorSettings();
            render();
            playSound('click');
        }

        function showLeoModal(htmlContent) {
            document.getElementById('leo-modal-content').innerHTML = htmlContent;
            const modalAvatar = document.getElementById('modal-avatar-box');
            if (modalAvatar) {
                modalAvatar.innerHTML = renderLeoAvatar('w-12 h-12', 'text-xl');
            }
            document.getElementById('leo-modal').classList.remove('hidden');
            playSound('warning');
        }

        function closeLeoModal() {
            document.getElementById('leo-modal').classList.add('hidden');
            playSound('click');
        }

        const CHARACTERS = [
            {
                id: 'manager',
                name: '陈建国 (30岁)',
                title: '高级项目经理 · 核心顶梁柱',
                desc: '月薪 RM 12,000 | 刚购入吉隆坡排屋，房贷 RM 3,200/月，育有一幼童',
                avatarBg: 'from-amber-500 to-amber-700',
                initialSavings: 45000,
                initialHealth: 88,
                monthlyIncome: 12000,
                monthlyExpense: 7500,
                icon: 'fa-briefcase'
            },
            {
                id: 'business',
                name: '林美婷 (30岁)',
                title: '连锁餐饮创办人 · 拼搏期老板',
                desc: '月薪 RM 16,000 | 现金流充沛但工作高压，赡养双亲，计划筹备第二家分店',
                avatarBg: 'from-indigo-500 to-purple-700',
                initialSavings: 80000,
                initialHealth: 82,
                monthlyIncome: 16000,
                monthlyExpense: 9500,
                icon: 'fa-store'
            },
            {
                id: 'engineer',
                name: '阿力 Leo (30岁)',
                title: '资深工程师 · 双薪家庭主夫',
                desc: '月薪 RM 9,500 | 生活稳健，每月定存 EPF，双亲步入高龄需医疗预备金',
                avatarBg: 'from-sky-500 to-blue-700',
                initialSavings: 35000,
                initialHealth: 92,
                monthlyIncome: 9500,
                monthlyExpense: 5800,
                icon: 'fa-laptop-code'
            }
        ];

        const AGE_STAGES = [
            { age: 30, name: '30~35 岁：事业黄金冲刺期', desc: '房贷、婚姻、育儿压力交织，高薪高压成为常态。' },
            { age: 35, name: '35~40 岁：家庭支柱巅峰期', desc: '孩子学费上涨，父母体检频繁出现指标异常。' },
            { age: 40, name: '40~45 岁：中年健康水岭期', desc: '身体代谢变慢，心血管与结节异常率大幅上升。' },
            { age: 45, name: '45~50 岁：子女高等教育与资产防线期', desc: '准备大学基金，同时步入大马重疾高发危险期。' },
            { age: 50, name: '50~55 岁：退休倒计时与大病高发期', desc: '身边的同龄朋友陆续出现健康危机，医疗成本激增。' },
            { age: 55, name: '55~60 岁：资产传承与最后防线', desc: '准备享受退休生活，绝不能让重疾掏空几十年的积蓄。' }
        ];

        // Global Game State
        let gameState = {
            screen: 'start',
            character: null,
            currentStageIdx: 0,
            health: 100,
            savings: 0,
            shieldLevel: 'NONE',
            historyLogs: [],
            totalCrisesHandled: 0,
            totalInsuranceClaims: 0,
            incomeLossPrevented: 0,
            avatarUrl: getSafeStorage('leo_advisor_avatar') || null

        function renderLeoAvatar(sizeClass = 'w-11 h-11', textClass = 'text-xl') {
            if (gameState.avatarUrl) {
                return `
                    <div class="${sizeClass} rounded-2xl overflow-hidden shadow-lg border-2 border-amber-400 flex-shrink-0 bg-slate-800">
                        <img src="${gameState.avatarUrl}" class="w-full h-full object-cover" alt="LEO 顾问个人照" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full bg-gradient-to-tr from-amber-500 via-amber-400 to-amber-600 flex items-center justify-center text-slate-950 font-black ${textClass}\'>LEO</div>';">
                    </div>
                `;
            }
            return `
                <div class="${sizeClass} rounded-2xl bg-gradient-to-tr from-amber-500 via-amber-400 to-amber-600 flex items-center justify-center text-slate-950 font-black ${textClass} shadow-lg shadow-amber-500/20 border-2 border-amber-300 flex-shrink-0">
                    <span>LEO</span>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            if (gameState.screen === 'start') {
                app.innerHTML = renderStartScreen();
            } else if (gameState.screen === 'play') {
                app.innerHTML = renderPlayScreen();
            } else if (gameState.screen === 'result') {
                app.innerHTML = renderResultScreen();
            }

            const headerAvatar = document.getElementById('header-avatar-box');
            if (headerAvatar) {
                headerAvatar.innerHTML = renderLeoAvatar('w-11 h-11', 'text-lg');
            }
        }

        function renderStartScreen() {
            return `
                <div class="flex-1 flex flex-col justify-center items-center max-w-4xl mx-auto w-full py-2 text-center space-y-6 animate-fade-in">
                    
                    <!-- LEO Personal Brand Banner Header -->
                    <div class="p-4 sm:p-5 rounded-3xl bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white shadow-2xl border-2 border-amber-400/40 w-full flex flex-col sm:flex-row items-center justify-between gap-4 relative overflow-hidden">
                        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl"></div>
                        
                        <div class="flex items-center space-x-4 text-left z-10">
                            ${renderLeoAvatar('w-16 h-16', 'text-2xl')}
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-extrabold text-base text-amber-400">LEO 家庭财富传承规划师</span>
                                    <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-400/20 text-amber-300 font-bold border border-amber-400/40">Wealth Advisor</span>
                                </div>
                                <p class="text-xs text-slate-300 italic font-medium mt-1">“用心守护 · 传承每一个家”</p>
                            </div>
                        </div>

                        <div class="text-right text-xs text-amber-300/90 font-medium z-10 border-t sm:border-t-0 sm:border-l border-slate-800 pt-2 sm:pt-0 sm:pl-4">
                            <div class="font-bold text-sm text-white">规划现在 · 守护未来</div>
                            <div class="text-[10px] text-slate-400 mt-0.5">大马家庭防线策略模拟演练</div>
                        </div>
                    </div>

                    <!-- Intro Title -->
                    <div class="space-y-3">
                        <div class="inline-flex items-center space-x-2 px-4 py-1.5 bg-amber-500/10 dark:bg-amber-500/20 text-amber-600 dark:text-amber-400 rounded-full text-xs font-bold border border-amber-500/30">
                            <i class="fa-solid fa-gamepad animate-bounce"></i>
                            <span>互动策略游戏：模拟大马家庭 30 岁至 60 岁黄金30年</span>
                        </div>
                        <h2 class="text-2xl sm:text-4xl font-black text-slate-900 dark:text-white tracking-tight leading-tight">
                            如果你能重新规划 <span class="gold-gradient-text">30岁到60岁</span> 的财务与健康<br/>能否化解突如其来的重大疾病与收入中断风暴？
                        </h2>
                        <p class="text-slate-600 dark:text-slate-300 text-xs sm:text-sm max-w-2xl mx-auto leading-relaxed">
                            大马人普遍存在误区：以为有 Medical Card 医保卡就够了。然而当重大疾病（心脏病、癌症、中风）降临时，真正的危机是 <strong class="text-amber-600 dark:text-amber-400">3~5 年不能工作的收入中断与家庭供养危机</strong>！

        function makeDecision(shieldType) {
            playSound('click');
            gameState.shieldLevel = shieldType;

            const c = gameState.character;
            const currentStage = AGE_STAGES[gameState.currentStageIdx];

            let income5Years = c.monthlyIncome * 12 * 5;
            let expense5Years = c.monthlyExpense * 12 * 5;
            
            let insuranceCost = 0;
            if (shieldType === 'MEDICAL_ONLY') insuranceCost = 200 * 12 * 5;
            if (shieldType === 'FULL_SHIELD') insuranceCost = 380 * 12 * 5;

            let netGain = income5Years - expense5Years - insuranceCost;
            gameState.savings += netGain;

            const riskRoll = Math.random();
            const riskThreshold = 0.35 + (gameState.currentStageIdx * 0.08); 

            if (riskRoll < riskThreshold) {
                gameState.totalCrisesHandled++;

                const diseases = [
                    { name: '早期甲状腺癌/乳腺肿瘤', medicalCost: 80000, incomeLossYears: 2 },
                    { name: '突发急性心肌梗塞 (Heart Attack)', medicalCost: 120000, incomeLossYears: 3 },
                    { name: '脑血管中风 (Stroke)', medicalCost: 150000, incomeLossYears: 4 },
                    { name: '结肠癌中晚期 (Colon Cancer)', medicalCost: 180000, incomeLossYears: 3 }
                ];

                const disease = diseases[Math.floor(Math.random() * diseases.length)];
                const totalIncomeLoss = (c.monthlyIncome * 12) * disease.incomeLossYears;

                if (shieldType === 'NONE') {
                    const totalDamage = disease.medicalCost + totalIncomeLoss;
                    gameState.savings -= totalDamage;
                    gameState.health -= 25;
                    const logMsg = `⚠️ 突发危机！你在 ${currentStage.age} 岁确诊【${disease.name}】！由于没有任何保险，你支付了 RM ${disease.medicalCost.toLocaleString()} 医疗费，并因停工 ${disease.incomeLossYears} 年损失 RM ${totalIncomeLoss.toLocaleString()} 收入！总损失 RM ${totalDamage.toLocaleString()}！`;
                    gameState.historyLogs.push(logMsg);

                    showLeoModal(`
                        <p class="text-rose-400 font-bold">⚠️ 风险真实爆发！</p>
                        <p>你在 ${currentStage.age} 岁面临了 <strong class="text-white">${disease.name}</strong> 的打击。</p>

                    `);

                } else if (shieldType === 'MEDICAL_ONLY') {
                    gameState.savings -= totalIncomeLoss;
                    gameState.health -= 18;
                    const logMsg = `🏥 在 ${currentStage.age} 岁确诊【${disease.name}】！Medical Card 报销了 RM ${disease.medicalCost.toLocaleString()} 医院账单。但因为无重疾现金理赔，停工 ${disease.incomeLossYears} 年导致损失 RM ${totalIncomeLoss.toLocaleString()} 家庭生活收入！`;
                    gameState.historyLogs.push(logMsg);

                    showLeoModal(`
                        <p class="text-sky-400 font-bold">🏥 揭示常见误区：Medical Card 的局限</p>
                        <p>你的 Medical Card 成功替你向医院支付了 RM ${disease.medicalCost.toLocaleString()} 的账单。</p>
                        <p class="mt-2"><strong class="text-rose-400">但是！</strong> 医疗卡不给一分钱现金。因为需要休养康复 ${disease.incomeLossYears} 年无法工作，你的家庭被迫承受了 <strong class="text-rose-400">RM ${totalIncomeLoss.toLocaleString()}</strong> 的收入断崖！</p>
                        <p class="mt-2 text-slate-300 text-xs">LEO 提醒：这就是为什么只买医疗卡是不够的！重疾险给的是自由支配的现金，用以抵消病后的供房、供车与孩子学费。</p>
                    `);

                } else if (shieldType === 'FULL_SHIELD') {
                    const claimPayout = 300000;
                    gameState.savings += (claimPayout - totalIncomeLoss);
                    gameState.health -= 10;
                    gameState.totalInsuranceClaims += claimPayout;
                    gameState.incomeLossPrevented += totalIncomeLoss;

                    const logMsg = `🛡️ 完美防御！在 ${currentStage.age} 岁确诊【${disease.name}】！Medical Card 全额报销医药费，且 LEO 30万重疾防线即时赔付 RM 300,000 现金！不仅弥补了停工损失，还锁定了家庭退休资产！`;
                    gameState.historyLogs.push(logMsg);

                    showLeoModal(`

            if (gameState.currentStageIdx >= AGE_STAGES.length) {
                gameState.screen = 'result';
            }

            render();
        }

                        </span>

                        <h2 class="text-2xl sm:text-4xl font-black text-slate-900 dark:text-white">
                            ${isSuccess ? '🎉 恭喜！你成功构建了稳健的大马家庭防线！' : '⚠️ 警示！你在退休前夕面临财务与健康双重危机！'}
                        </h2>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-3 max-w-2xl mx-auto text-xs font-bold">
                            <div class="p-3 bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700">
                                <span class="text-slate-400 font-normal block text-[10px]">60岁最终退休资产</span>
                                <span class="text-base font-black ${gameState.savings < 0 ? 'text-rose-500' : 'text-emerald-500'}">
                                    RM ${gameState.savings.toLocaleString()}
                                </span>
                            </div>

                            <div class="p-3 bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700">
                                <span class="text-slate-400 font-normal block text-[10px]">健康体魄评分</span>
                                <span class="text-base font-black ${gameState.health < 60 ? 'text-rose-500' : 'text-sky-500'}">
                                    ${gameState.health} / 100
                                </span>
                            </div>

                            <div class="p-3 bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700">
                                <span class="text-slate-400 font-normal block text-[10px]">化解重疾危机次数</span>
                                <span class="text-base font-black text-amber-500">
                                    ${gameState.totalCrisesHandled} 次
                                </span>
                            </div>

                            <div class="p-3 bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700">
                                <span class="text-slate-400 font-normal block text-[10px]">成功获得重疾现金理赔</span>
                                <span class="text-base font-black text-amber-400">
                                    RM ${gameState.totalInsuranceClaims.toLocaleString()}
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- LEO Personal Brand CTA Card -->
                    <div class="p-6 rounded-3xl bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white shadow-2xl border-2 border-amber-400/50 space-y-5">
                        
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-slate-800 pb-4">
                            <div class="flex items-center space-x-4">
                                ${renderLeoAvatar('w-16 h-16', 'text-2xl')}
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <h3 class="text-lg font-black text-amber-400">LEO 家庭财富传承规划师</h3>
                                        <span class="px-2 py-0.5 rounded bg-amber-400/20 text-amber-300 text-[10px] font-bold">Wealth Advisor</span>
                                    </div>
                                    <p class="text-xs text-slate-300 font-medium mt-0.5">“用心守护 · 传承每一个家 | 规划现在 · 守护未来”</p>
                                </div>
                            </div>

                            <!-- Direct WhatsApp CTA Button -->
                            <a href="https://wa.me/?text=Hi%20LEO,%20我体验了你的《人生重置计划》30-60岁大马家庭策略游戏，想向你咨询如何搭建我的家庭防线与重疾对冲规划。" target="_blank" class="px-6 py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white text-xs font-black rounded-xl shadow-lg shadow-emerald-500/20 transition transform hover:scale-105 flex items-center space-x-2 whitespace-nowrap">
                                <i class="fa-brands fa-whatsapp text-lg"></i>
                                <span>预约 LEO 一对一免费防线诊断</span>
                            </a>
                        </div>

                        <!-- LEO 5 Pillars Grid Breakdown -->
                        <div>
                            <p class="text-xs text-amber-300 font-bold mb-3">🛡️ LEO 大马家庭防线五大守护核心：</p>
                            <div class="grid grid-cols-1 sm:grid-cols-5 gap-2.5 text-center text-xs">
                                <div class="p-3 rounded-xl bg-white/5 border border-white/10 hover:border-amber-400/50 transition">
                                    <i class="fa-solid fa-notes-medical text-sky-400 text-lg mb-1 block"></i>
                                    <span class="font-bold text-slate-200">1. 医疗保障</span>
                                    <p class="text-[9px] text-slate-400 mt-1">结清医院账单</p>
                                </div>
                                <div class="p-3 rounded-xl bg-white/5 border border-white/10 hover:border-amber-400/50 transition">
                                    <i class="fa-solid fa-shield-halved text-amber-400 text-lg mb-1 block"></i>
                                    <span class="font-bold text-slate-200">2. 重疾保险</span>
                                    <p class="text-[9px] text-slate-400 mt-1">代替3-5年收入</p>
                                </div>
                                <div class="p-3 rounded-xl bg-white/5 border border-white/10 hover:border-amber-400/50 transition">
                                    <i class="fa-solid fa-handshake text-indigo-400 text-lg mb-1 block"></i>
                                    <span class="font-bold text-slate-200">3. 信托规划</span>
                                    <p class="text-[9px] text-slate-400 mt-1">隔离资产风险</p>
                                </div>
                                <div class="p-3 rounded-xl bg-white/5 border border-white/10 hover:border-amber-400/50 transition">
                                    <i class="fa-solid fa-file-signature text-rose-400 text-lg mb-1 block"></i>
                                    <span class="font-bold text-slate-200">4. 遗嘱规划</span>
                                    <p class="text-[9px] text-slate-400 mt-1">精准表达意愿</p>
                                </div>
                                <div class="p-3 rounded-xl bg-white/5 border border-white/10 hover:border-amber-400/50 transition">
                                    <i class="fa-solid fa-house-chimney-window text-emerald-400 text-lg mb-1 block"></i>
                                    <span class="font-bold text-slate-200">5. 财富传承</span>
                                    <p class="text-[9px] text-slate-400 mt-1">富过三代保障</p>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Interactive Risk Calculator Component -->
                    <div class="glass-card p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-slate-800">
                        <h3 class="font-black text-slate-900 dark:text-white text-base flex items-center gap-2">
                            <i class="fa-solid fa-calculator text-amber-500"></i>
                            🧮 LEO 现实家庭抗风险压力测试计算器：
                        </h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400">
                            现实中，如果今天不幸遭遇重疾被迫休养，无任何工作收入，你的家庭存款能维持几年的房贷车贷与生活开销？
                        </p>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                                    每月家庭硬性开支 (房贷+车贷+生活费/学费):
                                </label>
                                <div class="relative">
                                    <span class="absolute left-3 top-2.5 text-xs font-bold text-slate-400">RM</span>
                                    <input type="number" id="calc-expense" value="6000" oninput="calculateRealRisk()" class="w-full pl-10 pr-3 py-2 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs font-bold">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                                    目前个人/家庭应急流动存款总额:
                                </label>
                                <div class="relative">
                                    <span class="absolute left-3 top-2.5 text-xs font-bold text-slate-400">RM</span>
                                    <input type="number" id="calc-savings" value="50000" oninput="calculateRealRisk()" class="w-full pl-10 pr-3 py-2 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl text-xs font-bold">
                                </div>
                            </div>
                        </div>

                        <!-- Test result container -->
                        <div id="calc-result" class="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-xs text-slate-800 dark:text-slate-200 space-y-1">
                            <!-- Dynamic result loaded by JS -->
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                        <button onclick="restartGame()" class="w-full sm:w-auto px-8 py-3.5 bg-slate-900 dark:bg-amber-500 hover:bg-amber-600 dark:hover:bg-amber-400 text-white dark:text-slate-950 font-black text-xs rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>重新以其他角色体验模拟</span>
                        </button>
                    </div>

                </div>
            `;
        }

        function calculateRealRisk() {
            const expEl = document.getElementById('calc-expense');
            const savEl = document.getElementById('calc-savings');
            const res = document.getElementById('calc-result');

            if (!res || !expEl || !savEl) return;

            const exp = parseFloat(expEl.value) || 0;
            const sav = parseFloat(savEl.value) || 0;

            if (exp <= 0) {
                res.innerHTML = `<p class="font-bold">请输入有效的每月开支。</p>`;
                return;
            }

            const months = (sav / exp).toFixed(1);
            const years = (months / 12).toFixed(1);

            let statusColor = "text-rose-500";
            if (months >= 36) statusColor = "text-emerald-500";
            else if (months >= 12) statusColor = "text-amber-500";

            res.innerHTML = `
                <div class="flex items-center justify-between flex-wrap gap-1">
                    <span>在不工作的情况下，你的应急存款仅能支撑家庭：</span>
                    <strong class="${statusColor} text-base font-black">${months} 个月 (${years} 年)</strong>
                </div>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 pt-1">
                    💡 <strong>LEO 防线解读：</strong>重大疾病（如癌症或心血管危机）平均康复期为 <strong>3~5 年 (36~60个月)</strong>。若目前存款支撑不足3年，配置专属重疾险理赔金（如 RM 300,000）能瞬间将防线拉满！
                </p>
            `;
        }

        function restartGame() {
            playSound('click');
            gameState.screen = 'start';
            render();
        }

        window.onload = function() {
            render();
            setTimeout(() => {
                if (document.getElementById('calc-expense')) {
                    calculateRealRisk();
                }
            }, 500);
        };
    </script>
</body>
</html>
